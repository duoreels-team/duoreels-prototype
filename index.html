<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Duoreels · Hi-fi prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--surface:#1C1C1E;--control:#2C2C30;--line:#2C2C30;--white:#fff;--grey:#B0B0B8;--meta:#8A8A92;
  --violet:#8E6CFF;--brand:#6929D4;--ink:#100B19;--blue:#3D8BFF;--orange:#FF9A4D;--teal:#2EC4B6;--green:#3DE0A0;--yellow:#FFC94D;
  --disp:'Big Shoulders Display',Impact,sans-serif;--ui:'Geist',system-ui,-apple-system,sans-serif;--mono:'Geist Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);--cut:21px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0B0B0D;color:#fff;font-family:var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:#fff}
img{display:block}
#stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:22px 28px}
/* ---------- side map ---------- */
#map{width:260px;align-self:stretch;max-height:calc(100vh - 56px);overflow:auto;padding:4px 4px 24px}
#map h1{font-family:var(--disp);font-weight:900;font-size:40px;letter-spacing:.01em;margin:0 0 4px;line-height:1}
#map p{color:var(--meta);font-size:14px;margin:0 0 22px;line-height:1.45}
#map h2{font:600 14px var(--ui);letter-spacing:.1em;color:var(--meta);margin:20px 0 8px;text-transform:uppercase}
#map button{display:flex;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:14px;color:#ddd;gap:8px;align-items:center}
#map button:hover{background:#1C1C1E;color:#fff}
#map button .n{font:500 13px var(--mono);color:var(--meta);width:22px}
#map .sim{border:1px dashed #3a3a42;margin-top:6px}
@media (max-width:820px){#map{display:none}#stage{padding:0}}
/* ---------- phone ---------- */
#phone{position:relative;width:390px;height:844px;background:#000;border-radius:54px;overflow:hidden;overflow:clip;transform-origin:center center;box-shadow:0 0 0 10px #18181B,0 0 0 11px #2a2a2f,0 40px 120px rgba(105,41,212,.25);flex:none}
@media (max-width:500px){#phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}}
.sbar{position:absolute;top:0;left:0;right:0;height:47px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;z-index:60;pointer-events:none;font:600 16px var(--ui)}
.sbar .r{display:flex;gap:6px;align-items:center}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:61}
.hind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:9px;background:#fff;z-index:90;pointer-events:none;opacity:.9}
#views{position:absolute;inset:0;overflow:hidden;overflow:clip}
.view{position:absolute;inset:0;background:#000;overflow:hidden;overflow:clip;display:flex;flex-direction:column;transition:transform .42s var(--ease),opacity .42s var(--ease),filter .42s}
.view.in-r{transform:translateX(100%)}
.view.out-l{transform:translateX(-28%);filter:brightness(.45)}
.view.in-l{transform:translateX(-28%);filter:brightness(.45)}
.view.out-r{transform:translateX(100%)}
.view.fade-in{opacity:0;transform:scale(.985)}
.view.fade-out{opacity:0}
.view.up-in{transform:translateY(100%)}
.view.down-out{transform:translateY(100%)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-top:47px}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:0 16px}
/* ---------- type ---------- */
.ptitle{font:900 48px/0.95 var(--disp);letter-spacing:.005em;text-transform:uppercase;margin:0}
.wm{font:900 30px/1 var(--disp);letter-spacing:.02em}
.t28{font:700 28px/1.15 var(--ui);margin:0}
.t20{font:700 20px/1.2 var(--ui);margin:0}
.t17{font:600 17px/1.25 var(--ui)}
.t15{font:400 15px/1.45 var(--ui)}
.lab{font:600 14px var(--ui)}
.meta{font:400 14px/1.4 var(--ui);color:var(--meta)}
.grey{color:var(--grey)}
.mono{font-family:var(--mono);font-weight:500}
.sec{font:600 14px var(--ui);letter-spacing:.1em;color:var(--meta);text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.sec a,.sec button{letter-spacing:0;text-transform:none;font:600 14px var(--ui);color:#fff}
/* ---------- components ---------- */
.btn-main{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;width:100%;background:var(--violet);color:#000;font:900 20px var(--disp);letter-spacing:.03em;text-transform:uppercase;border-radius:12px;transition:transform .15s,background .2s,filter .2s}
.btn-main:active{transform:translateY(1px);background:var(--brand);color:#fff}
.btn-main[disabled]{background:var(--control);color:#6a6a72;pointer-events:none}
.btn-main.white{background:var(--violet)}
.btn-sec{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:8px;background:var(--control);font:600 15px var(--ui);transition:background .2s,transform .12s}
.btn-sec:active{transform:scale(.97);background:#3a3a40}
.btn-sec.sm{height:36px;font-size:14px;padding:0 12px}
.btn-card{display:inline-flex;align-items:center;justify-content:center;height:38px;padding:0 14px;border-radius:8px;border:1.5px solid #fff;font:900 18px var(--disp);letter-spacing:.03em;text-transform:uppercase;transition:background .2s,color .2s}
.btn-card:active{background:var(--control);color:#fff}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 13px;font:900 14px var(--disp);letter-spacing:.04em;text-transform:uppercase;color:#000;clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);white-space:nowrap}
.tag.green{background:var(--violet)}.tag.red{background:var(--yellow)}.tag.yellow{background:var(--yellow)}.tag.violet{background:var(--violet)}.tag.grey{background:var(--control);color:#fff}.tag.blue{background:var(--blue)}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid #3a3a42;font:600 14px var(--ui);white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.chip.on{color:#fff}
.chip{position:relative;isolation:isolate;border-color:transparent!important;border-radius:0!important;background:transparent!important;padding:0 15px}
.chip::before{content:"";position:absolute;inset:0;z-index:-1;border:1px solid #3a3a42;border-radius:3px;transform:skewX(-14deg);transition:background .2s,border-color .2s}
.chip.on::before{background:rgba(142,108,255,.22);border-color:var(--violet)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips.row::-webkit-scrollbar{display:none}
.seg{display:flex;background:#141416;border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;height:30px;border-radius:6px;font:600 14px var(--ui);color:var(--grey);transition:background .25s,color .25s;white-space:nowrap;padding:0 12px}
.seg button.on{background:var(--violet);color:#000;font-weight:600}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--c);color:#000;font-weight:700;flex:none;box-shadow:0 0 0 2px #000}
.avs{display:flex}.avs .av+.av{margin-left:-7px}
.ib{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;transition:background .2s}
.ib:active{background:#1C1C1E}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--c,var(--violet));flex:none}
.card{background:var(--surface);border-radius:12px}
.row{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border-radius:12px;width:100%;text-align:left;transition:background .2s,transform .15s}
.row:active{background:#26262A;transform:scale(.99)}
.row .tx{flex:1;min-width:0}
.row .tx .meta{margin-top:2px}
.rows{display:flex;flex-direction:column;gap:10px}
.mecard{display:block;width:100%;text-align:left;padding:16px;margin-top:22px}
.mecard .mtop{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.mecard .mtop .tx{flex:1;display:flex;flex-direction:column}.mecard .mtop b{font:900 24px var(--disp);letter-spacing:.03em}
.mecard .mlink{display:inline-flex;align-items:center;gap:2px;font:600 14px var(--ui);color:var(--violet)}
.mecard .mrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.mecard .mrow b{color:#fff;font-weight:600}
.list{background:var(--surface);border-radius:12px;overflow:hidden}
.list>.row{border-radius:0;background:transparent}
.list>.row+.row{border-top:1px solid #2a2a2e}
.thumb{background-size:cover;background-position:center;border-radius:8px;flex:none}
.field{background:var(--surface);border-radius:8px;padding:13px 14px;width:100%;border:1.5px solid transparent;outline:none;transition:border-color .2s}
.field:focus{border-color:var(--violet)}
textarea.field{resize:none;min-height:92px;line-height:1.45}
.lbl{font:600 14px var(--ui);letter-spacing:.1em;color:var(--meta);text-transform:uppercase;margin:20px 0 8px;display:block}
.topbar{display:flex;align-items:center;gap:6px;height:54px;padding:0 10px 0 6px;flex:none}
.topbar .tt{flex:1;min-width:0}
.topbar .tt b{display:block;font:600 17px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .tt span{display:flex;align-items:center;gap:6px;font:400 14px var(--ui);color:var(--meta);margin-top:1px}
.topbar .tt span .av{width:14px!important;height:14px!important;font-size:0!important;box-shadow:none}
.fixedtop{position:absolute;top:0;left:0;right:0;z-index:20;padding-top:47px;transition:background .3s,backdrop-filter .3s}
.fixedtop.glass{background:linear-gradient(rgba(12,12,14,.28),rgba(12,12,14,0));backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);padding-bottom:32px;-webkit-mask-image:linear-gradient(#000 0%,#000 45%,rgba(0,0,0,.6) 72%,transparent 100%);mask-image:linear-gradient(#000 0%,#000 45%,rgba(0,0,0,.6) 72%,transparent 100%)}
.toggle{width:46px;height:28px;border-radius:14px;background:#3a3a42;position:relative;transition:background .25s;flex:none}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.toggle.on{background:var(--violet)}.toggle.on::after{transform:translateX(18px)}
.bar{height:4px;border-radius:4px;background:#2C2C30;overflow:hidden}
.bar i{display:block;height:100%;background:var(--violet);border-radius:4px;transition:width .6s var(--ease)}
.glow-floor{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,rgba(16,11,25,0) 0%,rgba(105,41,212,.55) 70%,#6929D4 100%);filter:blur(10px);pointer-events:none}
/* ---------- tab bar ---------- */
#tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;justify-content:space-around;padding:8px 12px 0;z-index:40;background:rgba(0,0,0,.62);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid rgba(255,255,255,.06);transition:transform .38s var(--ease)}
#tabbar.hide{transform:translateY(110%)}
#tabbar button{display:flex;flex-direction:column;align-items:center;gap:4px;width:96px;color:var(--meta);font:500 14px var(--ui);transition:color .2s}
#tabbar button.on{color:#fff}
/* ---------- home cards ---------- */
.pcard{position:relative;display:flex;align-items:flex-start;gap:12px;background:var(--surface);border-radius:12px;padding:12px;width:100%;text-align:left;margin-top:14px;transition:transform .15s,box-shadow .4s}
.pcard:active{transform:scale(.985)}
.pcard .tag{position:absolute;top:-12px;right:46px}
.pcard.turn{}
.pcard.turn.ed{}
@keyframes turnlight{50%{box-shadow:0 0 0 1px rgba(142,108,255,.9),0 0 34px -4px rgba(142,108,255,.75)}}
@keyframes turnlightb{50%{box-shadow:0 0 0 1px rgba(61,139,255,.9),0 0 34px -4px rgba(61,139,255,.75)}}
.pcard .tx{flex:1;min-width:0}
.pcard .tx b{font:600 16px var(--ui);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .btn-card{height:32px;font-size:16px;padding:0 14px}
.pcard .tx .s{display:flex;align-items:center;gap:7px;margin-top:4px;font:400 14px var(--ui);color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:none;width:112px;text-align:left}
.rail .thumb{width:112px;height:112px;border-radius:10px;position:relative}
.dur{position:absolute;left:6px;bottom:6px;font:500 13px var(--mono);background:rgba(0,0,0,.6);backdrop-filter:blur(8px);padding:2px 6px;border-radius:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 10px}
.grid2 .gcard>.tag{margin-top:6px}
.grid2 .gcard .tag{font-size:14px;height:20px;padding:0 9px}
.grid2 .dur{font-size:13px;padding:1px 5px}
.gcard{text-align:left}
.gcard .thumb{width:100%;aspect-ratio:1;border-radius:12px;position:relative}
.gcard .thumb .tag{position:absolute;left:6px;top:8px;height:22px;font-size:14px}
.gcard b{display:block;font:600 14px var(--ui);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------- sheet / toast / banner ---------- */
#sheet-host{position:absolute;inset:0;z-index:70;pointer-events:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .35s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .45s var(--ease);max-height:88%;display:flex;flex-direction:column;padding-bottom:30px}
.sheet .grab{width:38px;height:5px;border-radius:5px;background:#48484f;margin:9px auto 4px;flex:none}
.sheet .sbody{overflow-y:auto;padding:6px 16px 0;scrollbar-width:none}
.sheet .sbody::-webkit-scrollbar{display:none}
#sheet-host.open{pointer-events:auto}
#sheet-host.open .backdrop{opacity:1}
#sheet-host.open .sheet{transform:none}
/* toast drops from the top (under the status bar) so it never covers the tool bar */
#toast-host{position:absolute;top:54px;left:16px;right:16px;z-index:90;display:flex;justify-content:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 8px 8px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--control);color:var(--white);font:600 15px/1.3 var(--ui);pointer-events:auto;box-shadow:0 12px 40px rgba(0,0,0,.6);animation:toastIn .45s var(--ease) both;cursor:pointer}
.toast>span:not(.check){flex:1;min-width:0;padding:6px 0}
.toast:not(:has(button)){padding-right:16px}
.toast .check{width:24px;height:24px}
.toast button{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--control);color:var(--violet);font:600 15px var(--ui)}
.toast.out{animation:toastOut .3s ease both}
@keyframes toastIn{from{opacity:0;transform:translateY(-120%)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-120%)}}
#banner{position:absolute;top:50px;left:10px;right:10px;z-index:85;transform:translateY(-220px);visibility:hidden;transition:transform .5s var(--ease),visibility 0s .5s}
#banner.show{transform:none;visibility:visible;transition:transform .5s var(--ease),visibility 0s}
#banner .in{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:rgba(36,36,40,.78);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 12px 40px rgba(0,0,0,.6);cursor:pointer}
.check{width:22px;height:22px;border-radius:50%;background:var(--violet);display:inline-flex;align-items:center;justify-content:center;color:#000;flex:none}
/* ---------- review ---------- */
.player{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}
.player .vid{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;border-radius:4px;overflow:hidden;cursor:crosshair}
.player .vid img{width:100%;height:100%;object-fit:cover;transform-origin:50% 40%;transition:transform 8s linear}
.player.playing .vid img{transform:scale(1.08)}
.pinb{position:absolute;display:flex;align-items:center;gap:7px;padding:5px 9px 5px 5px;border-radius:8px;background:rgba(0,0,0,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font:500 14px var(--ui);animation:pop .4s var(--ease) both;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinb .mono{font-size:13px;color:var(--grey)}
.ann{position:absolute;z-index:3;animation:annIn .3s ease both}
@keyframes annIn{from{opacity:0}to{opacity:1}}
.ann-dot{width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 2px #fff,0 2px 8px rgba(0,0,0,.4)}
.ann-ring{width:92px;height:62px;margin:-31px 0 0 -46px;border:2.5px solid var(--violet);border-radius:50%;transform:rotate(-8deg);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.ann-call{display:flex;gap:6px;align-items:flex-start;width:max-content;max-width:150px;padding:6px 10px 6px 6px;border-radius:12px;background:rgba(18,18,20,.58);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);font:500 13px/1.3 var(--ui);color:#fff}
.ann-call .mono{display:block;font-size:12px;color:var(--grey)}
.ann-voice{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;background:rgba(18,18,20,.58);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);transform:translate(-50%,-50%);cursor:pointer}
.ann-voice .pl{width:28px;height:28px;border-radius:50%;background:var(--violet);color:#000;display:flex;align-items:center;justify-content:center}
.ann-voice .wave{display:flex;align-items:center;gap:2px;height:18px}.ann-voice .wave i{width:2.5px;border-radius:2px;background:#fff;opacity:.85}
.ann-voice.on .wave i{animation:vw .9s ease-in-out infinite alternate}.ann-voice .wave i:nth-child(odd){animation-delay:.2s}
@keyframes vw{from{transform:scaleY(.4)}to{transform:scaleY(1)}}
.ann-voice .mono{font-size:12px;color:var(--grey)}
.ann-img{width:86px;transform:translate(-50%,-50%) rotate(3deg);border-radius:10px;overflow:hidden;background:#111;box-shadow:0 0 0 2px #fff,0 8px 24px rgba(0,0,0,.5);cursor:pointer}
.ann-img img{display:block;width:100%;height:104px;object-fit:cover}.ann-img span{display:block;padding:5px 7px;font:500 12px/1.25 var(--ui)}
.natt{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 10px;border-radius:12px;background:var(--control)}
.natt img{width:40px;height:52px;border-radius:6px;object-fit:cover}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.timerow{display:flex;align-items:center;gap:6px;padding:10px 16px 6px;flex:none}
.timerow .mono{font-size:13px;width:96px}
.vchip{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 10px;border-radius:8px;background:var(--control);font:600 14px var(--ui)}
.strip{position:relative;height:56px;margin:22px 16px 4px;border-radius:6px;flex:none;touch-action:none;cursor:pointer}
.strip .frames{position:absolute;inset:0;display:flex;gap:2px;border-radius:6px;overflow:hidden}
.strip .frames i{flex:1;background-size:cover;background-position:center;opacity:.85}
.strip .ph{position:absolute;top:-6px;bottom:-6px;width:3px;background:#fff;border-radius:2px;margin-left:-1.5px;box-shadow:0 0 8px rgba(0,0,0,.6);pointer-events:none}
.strip .pin{position:absolute;top:-24px;margin-left:-11px;display:flex;flex-direction:column;align-items:center;animation:pop .45s var(--ease) both;pointer-events:none}
.strip .pin .av{width:22px;height:22px;font-size:13px}
.strip .pin::after{content:'';width:2px;height:58px;background:var(--c);margin-top:2px;opacity:.9}
.ticks{display:flex;justify-content:space-between;padding:0 16px;font:500 13px var(--mono);color:var(--meta);flex:none}
.tools{display:flex;align-items:center;padding:8px 12px 30px;gap:4px;flex:none}
.tools .tl{width:58px;display:flex;flex-direction:column;align-items:center;gap:6px;font:500 14px var(--ui);color:#ddd;padding:6px 0;border-radius:10px;transition:background .2s}
.tools .tl:active,.tools .tl.on{background:#1C1C1E}
.tools .tl.on{color:var(--violet)}

.vempty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:0 16px}
.npsec{display:flex;align-items:center;gap:10px;margin:28px 0 12px}
.npn{width:22px;height:22px;border-radius:50%;background:#2C2C30;display:flex;align-items:center;justify-content:center;font:700 14px var(--ui)}
.npn.ok{background:var(--green);color:#000}
.upl{width:100%;display:flex;align-items:center;gap:14px;padding:16px;border-radius:12px;border:1.5px dashed #3a3a42;background:var(--surface);margin-top:8px}
.srcs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.srcs button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:10px;background:var(--surface);font:500 14px var(--ui);color:#ddd}
.sic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font:800 16px var(--ui)}
.clip{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;background:var(--surface);margin-top:8px;animation:voicein .25s var(--ease)}
.cbar{height:3px;border-radius:2px;background:#2C2C30;margin-top:6px;overflow:hidden}.cbar i{display:block;height:100%;background:var(--green);transition:width .3s}
.npopt{width:100%;display:flex;align-items:center;gap:10px;margin-top:24px;padding:14px 16px;border-radius:12px;background:var(--surface)}
.btn-main:disabled{background:#2C2C30;color:#8a8a92;box-shadow:none}
.revsum{display:flex;gap:18px;align-items:center;padding:16px;border-radius:12px;background:var(--surface)}
.stars{color:var(--violet);font-size:14px;letter-spacing:1px}
.rbarrow{display:flex;align-items:center;gap:8px;height:16px}.rtrack{flex:1;height:5px;border-radius:3px;background:#2C2C30;overflow:hidden}.rtrack i{display:block;height:100%;background:var(--violet)}
.rev{padding:16px 0;border-bottom:1px solid #2A2A2E}
[hidden]{display:none!important}
.prow{position:relative;margin-top:16px}
#sheet-host.notes .backdrop{background:transparent!important}
#sheet-host.notes .sheet{height:392px;max-height:none;background:#1C1C1E;transition:transform .45s var(--ease),height .35s var(--ease)}
#sheet-host.notes.tall .sheet{height:620px}
#sheet-host.notes .grab{cursor:ns-resize;width:44px;margin-top:10px}
.nhead{display:flex;align-items:center;margin:2px 0 4px}.nhead h3{flex:1;font:700 22px var(--ui)}
.nseg{width:auto;border-radius:20px;padding:3px;background:#2a2a2e}.nseg button{height:32px;border-radius:17px;font:500 15px var(--ui);padding:0 16px}
.nrow.n2{background:#1C1C1E;gap:14px;padding:16px 0;align-items:flex-start;border-bottom:1px solid #2c2c30}
.nrow.n2 .nt{width:48px;height:64px;border-radius:6px}
.nt .pdot{position:absolute;left:8px;bottom:12px;width:10px;height:10px;border-radius:50%;background:#8E6CFF;box-shadow:0 0 0 2px #fff}
.nt .ring{position:absolute;left:8px;top:22px;width:30px;height:22px;border-radius:50%;border:2px solid #8E6CFF}
.nwho{display:flex;align-items:center;gap:8px}.nwho b{font:600 16px var(--ui)}
.ntime{font-size:14px;color:var(--grey)}
.nfrom{font:700 14px var(--ui);color:#FFC94D;letter-spacing:.02em}
.ntxt{font:400 17px/1.4 var(--ui);color:#fff;margin-top:6px}
.nrow.n2 .att{border-radius:14px;height:26px;padding:0 10px;margin-top:8px}
.nrep{display:flex;gap:8px;align-items:center;margin-top:10px;padding-left:10px;border-left:2px solid #3a3a42;color:var(--grey);font:400 15px var(--ui)}
.nreply{display:block;margin-top:12px;font:500 15px var(--ui);color:#9a9aa2}
.nrow.n2 .circ{width:28px;height:28px;border:1.5px solid #8a8a92}
.nrow.n2 .circ.on{background:#3a3a40;border-color:#3a3a40;color:#fff}
.nrow.n2.done{opacity:.35}
.ndone{display:flex;align-items:center;gap:8px;margin:18px 0 0;font:500 15px var(--ui);color:var(--grey)}
.nsw{position:relative;overflow:hidden}.nsw .nrow{touch-action:pan-y;transition:transform .3s var(--ease)}
.ndel{position:absolute;right:0;top:0;bottom:0;width:88px;background:#E5484D;color:#fff;font:600 15px var(--ui)}
.nsend{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;padding:14px 0 6px;background:linear-gradient(transparent,#1C1C1E 35%)}
.ntidy{display:inline-flex;align-items:center;gap:6px;height:48px;padding:0 16px;border-radius:24px;background:#2a2a2e;font:600 15px var(--ui);flex:none}
.nsendbtn{flex:1;height:54px;border-radius:28px;background:var(--violet);color:#000;font:900 24px var(--disp);letter-spacing:.02em;text-transform:uppercase;box-shadow:0 8px 28px rgba(142,108,255,.45)}

.plink{display:flex;align-items:center;gap:10px;height:48px;margin-top:10px;padding:0 6px 0 14px;border-radius:12px;background:var(--surface)}.plink input{flex:1;min-width:0;background:none;border:0;outline:none;color:#fff;font:400 15px var(--ui)}.plink input::placeholder{color:var(--meta)}.plink button{height:36px;padding:0 12px;border-radius:8px;color:var(--violet)}
.mrow{align-items:center;gap:12px;padding-top:12px;padding-bottom:12px}.mrow .tx{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.ml1{display:flex;align-items:baseline;gap:6px;min-width:0}.ml1 b{font:600 16px var(--ui);white-space:nowrap;flex:none}.mproj{font:400 14px var(--ui);color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mtxt{font:400 15px var(--ui);color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mrow.u .mtxt{color:#eee}
.mr{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none;align-self:stretch;justify-content:center}.mtime{font:400 14px var(--ui);color:var(--grey)}

.prow.big{padding:12px}.prow.big .cv34{width:76px}.prow.big .tx{gap:5px}.prow.big .tx b{font-size:17px}
.hbtn{height:32px!important;font-size:16px!important;padding:0 14px!important;margin-top:4px}
.wrow{gap:12px}.wrow .tx b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wrow .tx .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv34.sm{width:48px;border-radius:6px}.cv34.sm .cut{left:3px;bottom:3px;height:18px;padding:0 4px;border-radius:4px}

.prow .rtag{position:absolute;top:-9px;right:14px;height:20px;font-size:14px;padding:0 10px;z-index:2}
.cv34 .cut{position:absolute;left:4px;bottom:4px;display:inline-flex;align-items:center;height:20px;padding:0 5px;border-radius:5px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);font:500 13px var(--mono);color:#fff}
.stars{display:inline-flex;gap:2px;vertical-align:middle}.stars svg{width:15px;height:15px}.stars svg{display:block}
.reel .dur,.dur{display:inline-flex;align-items:center;gap:3px}
.chip svg{margin-left:4px;vertical-align:-2px}
.sim .n.ic{display:inline-flex;align-items:center;justify-content:center}
.btn-sec svg{margin-right:4px;vertical-align:-3px}

/* ---- home: logo-field + one light hero, slanted main button (same slant as tags) ---- */
.btn-main.slant{border-radius:0;clip-path:polygon(22px 0,100% 0,calc(100% - 22px) 100%,0 100%)}
.prow.big .tx .tag{margin-top:3px}
/* home: tighter in-progress cards */
.prow.big{padding:10px;gap:12px;margin-top:10px}.prow.big .cv34{width:60px}.prow.big .tx{gap:4px}.prow.big .tx b{font-size:16px}.prow.big .tx .tag{margin-top:2px}
/* ---- one button system: L = 48 (full width / main), M = 44 (inline pairs, bars); Big Shoulders caps everywhere ---- */
.btn-main,.btn-sec:not(.btn-auth),.nsendbtn,.ntidy{height:48px!important;border-radius:12px;font:900 20px var(--disp)!important;letter-spacing:.03em;text-transform:uppercase;box-shadow:none}
.btn-sec:not(.btn-auth),.ntidy{padding:0 18px;background:var(--control);color:#fff}
.btn-sec.sm,.dbtn,.btn-card,.notesbtn{height:44px!important;min-width:96px;padding:0 16px;border-radius:12px;font:900 18px var(--disp)!important;letter-spacing:.03em;text-transform:uppercase;margin:0!important;flex:none}
.btn-sec.sm{background:var(--control);color:#fff}
.notesbtn{background:var(--control);color:#fff;gap:8px;justify-content:center}
.badge.zero{background:#3a3a42;color:var(--grey)}
.dbtn{background:var(--violet);color:#000}
.btn-card{border:1.5px solid #fff;background:transparent;color:#fff}

/* buttons that sit side by side always share the width equally */
:is(div,span):has(> :is(.btn-main,.btn-sec:not(.btn-auth)) + :is(.btn-main,.btn-sec:not(.btn-auth))) > :is(.btn-main,.btn-sec:not(.btn-auth)){flex:1 1 0!important;width:auto!important;min-width:0}
.btn-main,.btn-sec:not(.btn-auth),.btn-sec.sm,.dbtn,.btn-card,.notesbtn{white-space:nowrap}
.btn-sec:not(.btn-auth),.btn-main{padding:0 12px;box-sizing:border-box}

/* home hero scrolls away with New project; empty video = logo field + one light */
.home-scroll{position:relative}
.home-scroll>.pad{position:relative;z-index:1}

/* uploading = moving stripes on the existing upload bars */
@keyframes upmove{to{transform:translateX(15.3px)}}
.cbar.up{height:6px;border-radius:4px}
.cbar.up i{border-radius:4px;background:linear-gradient(100deg,#8E6CFF,#3D8BFF);position:relative;overflow:hidden}

function pRow(p,tag){return `<div class="row wrow" data-act="openProject" data-id="${p.id}" role="button" tabindex="0"><div class="cv34 sm" style="${bg(p.img)}"><span class="cut">${mmss(p.dur)}</span></div><span class="tx"><b class="lab">${p.title}</b><div class="meta">${metaLine(p)}</div>${tag?`<div style="margin-top:6px">${tag}</div>`:''}</span>${p.eds?`<span class="avs">${p.eds.map(k=>av(k,24)).join('')}</span>`:av(p.ed,24)}<button class="ib" style="width:30px;margin-right:-6px;color:var(--grey)" data-act="more" data-id="${p.id}" aria-label="More">${I('more',20)}</button></div>`;}
V.home=()=>{
  const prog=S.projects.filter(p=>p.status==='progress');
  const order=p=>p.newV?0:p.asks?1:p.turn==='me'?2:3;
  const need=p=>p.newV||p.asks||p.turn==='me';
  const mine=[...prog].filter(need).sort((a,b)=>order(a)-order(b)),rest=prog.filter(p=>!need(p));
  const done=S.projects.filter(p=>p.status==='done');
  const unread=S.inbox.filter(m=>m.u).length;
  return {tab:'home',html:`<div class="fixedtop"><div style="display:flex;align-items:center;height:54px;padding:0 10px 0 16px"><span style="flex:1;display:flex;align-items:center"><button data-act="accounts" aria-label="Switch account" style="display:flex;align-items:center;height:44px;margin-left:-6px;padding:0 6px">${MARK(30)}</button></span><button class="ib" data-act="go" data-to="activity" aria-label="Messages" style="position:relative">${I('bell')}${unread?`<i style="position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:#fff"></i>`:''}</button></div></div>

   <button class="row" style="margin-top:16px" data-act="tab" data-to="market"><span style="color:var(--grey)">${I('bag',20)}</span><span class="tx lab">Need an editor? Find one in Marketplace</span>${I('chev',18)}</button>
   <div class="sec"><span>Done · ${done.length}</span><button data-act="allDone">See all ›</button></div>

  </div></div>`};
};

 const ed=PPL[NP.editor].n, okFoot=NP.clips.length>0;

  <label class="lbl">References</label><div style="display:flex;gap:8px">${NP.refs.map(r=>`<div class="reel" style="${bg(r)};width:84px"><span class="dur"></span></div>`).join('')}<button style="width:84px;aspect-ratio:9/13;border-radius:8px;border:1.5px dashed #3a3a42;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:500 14px var(--ui);color:var(--grey)" data-act="npRef">${I('plus',20)}Add a link</button></div>
  <label class="lbl">Details</label><div class="list">
   <button class="row" data-act="pickEditor"><span class="tx">Editor</span>${av(NP.editor,22)}<b class="lab">${NP.editor==='L'?'Leo Park':'Sara Kim'}</b>${I('chev',16)}</button>

   <button class="row" data-act="info" data-t="First cut" data-d="Due 11.27 at 6 pm. Maya sees it the moment you upload."><span class="tx">First cut</span><b class="lab">11.27 · 6 pm</b>${I('chev',16)}</button>
   <button class="row" data-act="info" data-t="Payment" data-d="Half is held when you accept, half is released when Maya approves the final. Service fee 5%."><span class="tx">Payment</span><b class="lab">50% now · 50% on approval</b>${I('chev',16)}</button></div>

function npAddClip(c){c.id='c'+Date.now()+Math.random().toString(36).slice(2,5);c.p=0;NP.clips.push(c);npRe();const t=setInterval(()=>{c.p=Math.min(100,c.p+Math.round(8+Math.random()*14));const el=$('#clip-'+c.id);if(el){$('.cbar i',el).style.width=c.p+'%';$('.cbar',el).classList.toggle('up',c.p<100);$('[data-st]',el).textContent=c.p<100?`Uploading · ${c.p}%`:c.meta;}if(c.p>=100){clearInterval(t);if(NP.clips.length===1||$('#clip-'+c.id))npRe();}},350);}

V.coverpick=({id='mr'})=>{const p=proj(id);const frames=Array.from({length:9},(_,i)=>`<i style="${bg(p.vimg)};background-position:${i*12}% ${30+i*5}%"></i>`).join('');return {html:`<div style="padding-top:47px;display:flex;flex-direction:column;height:100%">${topbar('Cover','3:4 · used on Home, All projects and Done',`<button class="btn-card" style="height:32px;font-size:16px;margin-right:6px" data-act="saveCover">Save</button>`)}
  <div class="seg" style="margin:4px 16px 0"><button class="on" data-act="orient" data-o="v">Vertical 9:16</button><button data-act="orient" data-o="h">Horizontal 16:9</button></div>
  <div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px 16px"><div id="cov" data-o="v" data-img="${p.vimg}" style="position:relative;height:100%;aspect-ratio:9/16;max-width:100%;border-radius:6px;overflow:hidden;${bg(p.vimg)};background-size:cover;background-position:50% 40%"><div id="sq" style="position:absolute;left:0;top:0;border:2.5px solid #fff;border-radius:6px;box-shadow:0 0 0 999px rgba(0,0,0,.4);touch-action:none;cursor:grab"><span id="ctitle" contenteditable="true" style="position:absolute;left:50%;bottom:12%;transform:translateX(-50%);background:#000;padding:6px 12px;font:700 15px var(--ui);border-radius:4px;white-space:nowrap;outline:none">My 5 am routine</span></div></div></div>
  <p class="meta" style="text-align:center;margin:0 20px">Auto = centre of the middle frame. Drag the 3:4 box, or pick another frame below.</p>
  <div class="meta" style="display:flex;justify-content:space-between;padding:10px 16px 0"><span class="mono" id="ct">0:21 / ${fmt(p.dur)}</span><span>Drag to pick the frame</span></div>
  <div class="strip" id="cstrip" style="margin:10px 16px 30px;height:56px"><div class="frames">${frames}</div><div class="cover-win" id="cwin" style="left:46%"></div></div></div>`,
  mount(el){const s=$('#cstrip',el),w=$('#cwin',el),c=$('#cov',el),sq=$('#sq',el);let d=false;const mv=e=>{const r=s.getBoundingClientRect();const x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));w.style.left=`calc(${x*100}% - 20px)`;c.style.backgroundPosition=`${x*100}% ${30+x*40}%`;$('#ct',el).textContent=`${fmt(x*p.dur)} / ${fmt(p.dur)}`;};s.addEventListener('pointerdown',e=>{d=true;s.setPointerCapture(e.pointerId);mv(e)});s.addEventListener('pointermove',e=>d&&mv(e));s.addEventListener('pointerup',()=>d=false);
   let ds=false;sq.addEventListener('pointerdown',e=>{if(e.target.id==='ctitle')return;ds=true;sq.setPointerCapture(e.pointerId);sq._s=[e.clientX,e.clientY,sq.offsetLeft,sq.offsetTop];});sq.addEventListener('pointermove',e=>{if(!ds)return;const [x0,y0,l0,t0]=sq._s;if(c.dataset.o==='h'){sq.style.left=Math.min(c.clientWidth-sq.offsetWidth,Math.max(0,l0+e.clientX-x0))+'px';}else{sq.style.top=Math.min(c.clientHeight-sq.offsetHeight,Math.max(0,t0+e.clientY-y0))+'px';}});sq.addEventListener('pointerup',()=>ds=false);
   requestAnimationFrame(placeSq);}}};
function placeSq(){const c=$('#cov'),sq=$('#sq');if(!c||!sq)return;const W=c.clientWidth,H=c.clientHeight;if(c.dataset.o==='h'){const w=H*3/4;Object.assign(sq.style,{top:'0px',height:H+'px',width:w+'px',left:((W-w)/2)+'px'});}else{const h=Math.min(H,W*4/3);Object.assign(sq.style,{left:'0px',width:W+'px',height:h+'px',top:((H-h)/2)+'px'});}}

  if(c===2)setTimeout(()=>{const v=$('#views .view:last-child');const e=$('[data-to=market]',v),sc=$('.scroll',v);if(e&&sc)sc.scrollTo({top:e.offsetTop-320,behavior:'smooth'});},500);
  if(c===4)setTimeout(()=>filterSheet(),450);
  if(c===5){go('project',{id:'mr'});go('coverpick',{id:'mr'});}
  if(c===6)go('all');
  if(c===7)act.allDone();
  if(c===8)go('project',{id:'mr'});
  if(c===9){go('project',{id:'mr'});setTimeout(()=>act.editName({dataset:{id:'mr'}}),520);}}
});
function filterSheet(keep){const f=S.filter;const n=filtered().length;
 const html=`<div style="display:flex;align-items:center;margin:4px 0 4px"><h3 class="t20" style="flex:1">Filter</h3><button class="lab" style="color:var(--meta)" data-act="fClear">Clear</button></div>
 <label class="lbl">Status</label><div class="chips">${[['all','All'],['progress','In progress'],['done','Done']].map(([v,l])=>`<button class="chip ${f.status===v?'on':''}" data-act="fStatus" data-v="${v}">${l} ${S.projects.filter(p=>v==='all'||p.status===v).length}</button>`).join('')}</div>
 <label class="lbl">Type · pick any</label><div class="chips">${['Vlog','Food','Talking head','Product','Travel'].map(t=>`<button class="chip ${f.types.includes(t)?'on':''}" data-act="fType" data-v="${t}">${t} ${S.projects.filter(p=>p.type===t).length}</button>`).join('')}</div>
 <label class="lbl">Sort</label><div class="seg">${['Newest','Deadline','Last change'].map(s=>`<button class="${f.sort===s?'on':''}" data-act="fSort" data-v="${s}">${s}</button>`).join('')}</div>
 <div style="margin-top:20px"><button class="btn-main" data-act="fShow" ${n?'':'disabled'}>Show ${n} project${n===1?'':'s'}</button></div>`;
 if(keep&&$('#sheet-host').classList.contains('open')){$('#sheet-host .sbody').innerHTML=html;}else openSheet(html);}

/* ================= event delegation ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=act[el.dataset.act]; if(!a) return;
  if(el.closest('#phone')&&el.dataset.act!=='closeSheet'&&el.tagName!=='INPUT') {}
  a(el,e);
});
document.addEventListener('input',e=>{if(e.target.id==='aq'){const q=e.target.value.toLowerCase().trim();$$('.gcard').forEach(g=>g.style.display=!q||g.dataset.title.includes(q)?'':'none');}});
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click();} });
// drag sheet down to close
(()=>{const sh=$('.sheet');let y0=null,dy=0;$('.grab').addEventListener('pointerdown',e=>{y0=e.clientY;sh.style.transition='none';$('.grab').setPointerCapture(e.pointerId);});
 $('.grab').addEventListener('pointermove',e=>{if(y0==null)return;dy=e.clientY-y0;if(dy<0){if(dy<-40&&$('#sheet-host').classList.contains('notes'))$('#sheet-host').classList.add('tall');return;}sh.style.transform=`translateY(${dy}px)`;});
 $('.grab').addEventListener('pointerup',()=>{sh.style.transition='';sh.style.transform='';const h=$('#sheet-host');if(h.classList.contains('notes')&&Math.abs(dy)<6){h.classList.toggle('tall');if(h.classList.contains('tall')&&$('.nseg .on[data-t=all]'))notesSheet('all');}else if(dy>90){if(h.classList.contains('tall')){h.classList.remove('tall');}else closeSheet();}y0=null;dy=0;});})();

/* ================= keep the phone fixed + fit to window ================= */
(()=>{const ph=$('#phone');['#phone','#views'].forEach(sel=>{const n=$(sel);n.addEventListener('scroll',()=>{n.scrollTop=0;n.scrollLeft=0;});});
 const fit=()=>{if(innerWidth<=500){ph.style.transform='';ph.style.margin='';return;}const sc=Math.min(1,(innerHeight-44)/(844+22));ph.style.transform=sc<1?`scale(${sc})`:'';ph.style.margin=sc<1?`${-(844*(1-sc))/2}px ${-(390*(1-sc))/2}px`:'';};
 addEventListener('resize',fit);fit();})();
/* ================= boot ================= */
S=freshState();
reset('splash',{},'none');
</script>
</body>
